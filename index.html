<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>맞추다 - 토목기사 실기 말따먹기 (전체 DB 적용)</title>
  <style>
    :root {
      --primary: #e61e2b;
      --primary-bg: #fff5f5;
      --success: #4caf50;
      --success-bg: #e8f5e9;
      --danger: #f44336;
      --danger-bg: #ffebee;
      --text: #333333;
      --gray-light: #f5f5f5;
      --border: #e0e0e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text); }
    .phone-container { width: 100%; max-width: 420px; height: 100vh; max-height: 840px; background: #ffffff; box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .screen { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; background: white; }
    .screen.active { display: flex; }
    .header { height: 56px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: bold; font-size: 18px; }
    .header-left, .header-right { display: flex; align-items: center; gap: 16px; font-size: 20px; cursor: pointer; }
    .header-logo { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 800; color: #111; }
    .logo-box { width: 20px; height: 20px; background: var(--primary); border-radius: 4px; position: relative; }
    .logo-box::after { content: ''; position: absolute; top: 4px; left: 4px; width: 8px; height: 8px; background: white; border-radius: 1px; }
    .content { flex: 1; overflow-y: auto; padding: 20px 16px; -webkit-overflow-scrolling: touch; }
    
    .main-title-box { text-align: center; margin: 40px 0 24px; }
    .main-title { font-size: 26px; font-weight: 800; line-height: 1.3; color: #111; word-break: keep-all; }
    .qty-selector { background: var(--gray-light); border-radius: 12px; padding: 20px; margin-bottom: 24px; text-align: center; }
    .qty-label { font-size: 14px; color: #666; margin-bottom: 12px; }
    .qty-ctrl { display: flex; align-items: center; justify-content: center; gap: 20px; }
    .btn-qty { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: white; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .qty-number { font-size: 24px; font-weight: bold; min-width: 80px; }
    .btn-start { width: 100%; height: 52px; background: #1976d2; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 40px; }
    
    .sub-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; height: 36px; font-size: 14px; color: #666; }
    .progress-track { flex: 1; height: 4px; background: var(--gray-light); border-radius: 2px; margin: 0 12px; position: relative; }
    .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: #1976d2; width: 0%; transition: width 0.3s ease; border-radius: 2px; }
    
    .question-wrapper { margin-bottom: 24px; }
    .question-num { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 8px; }
    .question-text { font-size: 16px; font-weight: bold; line-height: 1.5; margin-bottom: 8px; word-break: keep-all; }
    .question-guide { font-size: 13px; color: #1976d2; font-weight: bold; margin-bottom: 16px; }

    .options-list { display: flex; flex-direction: column; gap: 12px; }
    .option { display: flex; align-items: center; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; font-size: 15px; line-height: 1.4; transition: all 0.2s ease; }
    .option-num { width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-size: 12px; font-weight: bold; flex-shrink: 0; background: white; }
    .option.selected { border-color: #1976d2; background-color: #f5f9ff; }
    .option.selected .option-num { border-color: #1976d2; background-color: #1976d2; color: white; }
    .option.correct { border-color: var(--success) !important; background-color: var(--success-bg) !important; }
    .option.correct .option-num { border-color: var(--success) !important; background-color: var(--success) !important; color: white; }
    .option.incorrect { border-color: var(--danger) !important; background-color: var(--danger-bg) !important; text-decoration: line-through; }
    .option.incorrect .option-num { border-color: var(--danger) !important; background-color: var(--danger) !important; color: white; }

    .subjective-box { display: flex; flex-direction: column; gap: 12px; }
    .subjective-input { width: 100%; height: 120px; padding: 16px; font-size: 15px; border: 1px solid var(--border); border-radius: 12px; resize: none; line-height: 1.5; }
    .subjective-input:focus { outline: none; border-color: #1976d2; }
    .btn-idk { align-self: flex-end; padding: 8px 16px; background: #fff; border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-idk:active { background: var(--danger-bg); }
    .subjective-result-text { font-size: 15px; font-weight: bold; margin-top: 12px; padding: 12px; border-radius: 8px; display: none; }
    .subjective-result-text.correct { background: var(--success-bg); color: var(--success); display: block; border: 1px solid var(--success); }
    .subjective-result-text.incorrect { background: var(--danger-bg); color: var(--danger); display: block; border: 1px solid var(--danger); }

    .explanation-box { margin-top: 24px; padding: 16px; background: var(--gray-light); border-radius: 12px; display: none; }
    .exp-title { font-weight: bold; color: #333; margin-bottom: 6px; font-size: 14px; }
    .exp-text { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 12px; }
    .exp-real-answer { font-size: 14px; font-weight: bold; color: var(--primary); background: white; padding: 10px; border-radius: 8px; border: 1px dashed var(--border); }

    .footer-btn-area { padding: 16px; border-top: 1px solid var(--border); }
    .btn-next { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--border); background: #fdfdfd; color: #aaa; font-size: 15px; font-weight: bold; cursor: not-allowed; }
    .btn-next.ready { background: #ffffff; border: 1px solid #111; color: #111; cursor: pointer; }

    .result-summary-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 24px; }
    .result-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; }
    .result-val { font-weight: bold; color: var(--primary); }
    .result-header { font-size: 18px; font-weight: bold; margin-bottom: 16px; }
    .review-card { border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; position: relative; }
    .review-card.correct { border-color: var(--success); }
    .review-card.incorrect { border-color: var(--danger); }
    .badge { position: absolute; top: 12px; left: 12px; width: 24px; height: 24px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; }
    .badge.correct { background: var(--success); }
    .badge.incorrect { background: var(--danger); }
    .review-q-text { font-size: 14px; font-weight: bold; margin-left: 32px; margin-bottom: 12px; line-height: 1.4; }
    .review-exp { background: var(--gray-light); border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 12px; color: #666; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="phone-container">
    <!-- 1. 메인 화면 -->
    <div id="screen-main" class="screen active">
      <div class="header">
        <div class="header-logo"><div class="logo-box"></div>맞추다</div>
        <div class="header-right">👤 ☰</div>
      </div>
      <div class="content">
        <div class="main-title-box">
          <h1 class="main-title">토목기사 실기<br>말따먹기 마스터</h1>
        </div>
        <div class="qty-selector">
          <div class="qty-label">기출문제 출제 수 조절 (10~110)</div>
          <div class="qty-ctrl">
            <button class="btn-qty" onclick="adjustQty(-10)">-</button>
            <span class="qty-number" id="qty-disp">20문제</span>
            <button class="btn-qty" onclick="adjustQty(10)">+</button>
          </div>
        </div>
        <button class="btn-start" onclick="startStudy()">학습 시작하기</button>
      </div>
    </div>

    <!-- 2. 학습(문제) 화면 -->
    <div id="screen-study" class="screen">
      <div class="header">
        <div class="header-left" onclick="goToMain()">✕</div>
        <div>맞춤 학습</div>
        <div class="header-right" style="opacity:0;">✕</div>
      </div>
      <div class="sub-bar">
        <span id="progress-text">1 / 20</span>
        <div class="progress-track"><div id="progress-bar" class="progress-fill"></div></div>
        <span id="timer-text">00:00</span>
      </div>
      <div class="content" id="quiz-content">
        <!-- 동적 삽입 -->
      </div>
      <div class="footer-btn-area">
        <button class="btn-next" id="btn-submit" onclick="handleNext()">제출</button>
      </div>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="screen-result" class="screen">
      <div class="header">
        <div class="header-left" onclick="goToMain()">✕</div>
        <div>학습 결과</div>
        <div class="header-right" style="opacity:0;">✕</div>
      </div>
      <div class="content" style="background-color: #f9fafb;">
        <div class="result-header">학습 개요</div>
        <div class="result-summary-card">
          <div class="result-row"><span>총 문제 수</span><span class="result-val" id="res-total"></span></div>
          <div class="result-row"><span>맞은 문제 수</span><span class="result-val" style="color:var(--success);" id="res-correct"></span></div>
          <div class="result-row"><span>걸린 시간</span><span class="result-val" style="color:#111;" id="res-time"></span></div>
        </div>
        <div class="result-header">내가 푼 문제 분석</div>
        <div id="review-list"></div>
      </div>
    </div>
  </div>

      { type: 'single', q: "슬럼프가 낮은 빈배합 콘크리트를 덤프트럭 운반, 불도저 포설 후 진동롤러로 다져 축조하는 댐 형식은?", options: ["아치댐", "중력식댐", "롤러다짐 콘크리트댐", "록필댐"], answer: 2, exp: "롤러다짐 콘크리트댐(RCCD)입니다." },
      { type: 'subjective', q: "측구의 형식을 쓰시오.", answerText: "L형, U형, V형, 산마루형", keywords: ["L", "U", "V", "산마루"], exp: "형식: L형, U형, V형, 산마루형" },
      { type: 'subjective', q: "동상이 발생하기 쉬운 조건을 서술하시오.", answerText: "동상 받기 쉬운 흙 존재, 0도 이하 온도 지속, 물의 충분한 공급", keywords: ["흙", "0도", "물"], exp: "조건: 동상토, 영하 온도 유지, 수분 공급" },
      { type: 'subjective', q: "교량의 교대에 많이 사용되는 구조형식을 쓰시오.", answerText: "중력식, 반중력식, 역T형식, 뒷부벽식, 라멘식", keywords: ["중력", "반중력", "역T", "뒷부벽", "라멘"], exp: "형식: 중력, 반중력, 역T, 부벽, 라멘" },
      { type: 'subjective', q: "앵커의 주요 구성요소를 쓰시오.", answerText: "앵커두부, 인장부, 앵커체", keywords: ["두부", "인장부", "앵커체"], exp: "구성: 두부, 인장부, 앵커체" },
      { type: 'subjective', q: "N치로 추정되는 흙의 특성 사항을 쓰시오.", answerText: "내부마찰각, 상대밀도, 지지력계수, 탄성계수", keywords: ["마찰각", "상대밀도", "지지력", "탄성"], exp: "추정사항: 내부마찰각, 상대밀도, 지지력계수, 탄성계수" },
      { type: 'subjective', q: "침하조건식 및 침하촉진방법을 각각 쓰시오.", answerText: "조건식: W > F+Q+B / 촉진방법: 재하중, 분사식, 물하중, 발파, 감압 공법", keywords: ["W", "F", "Q", "B", "재하중", "분사", "감압"], exp: "조건식(W>F+Q+B) / 방법(재하중, 분사, 물하중 등)" },
      { type: 'single', q: "콘크리트 타설 전 파이프를 배관하고 내부에 냉각수를 순환시켜 온도를 낮추는 방법은?", options: ["관로식 냉각", "선행 냉각", "수화열 억제", "촉진 양생"], answer: 0, exp: "관로식 냉각(Pipe cooling)입니다." },
      { type: 'single', q: "콘크리트를 타설하기 전 재료의 일부 또는 전부를 미리 차갑게 하여 온도를 낮추는 방법은?", options: ["관로식 냉각", "선행 냉각", "프리웨팅", "오토클레이브"], answer: 1, exp: "선행 냉각(Pre-cooling)입니다." },
      { type: 'subjective', q: "성토재료에 요구되는 흙의 성질을 서술하시오.", answerText: "투수성 낮음, 다져진 흙의 전단강도 큼, 시공장비 트래피커빌리티 확보, 압축성 작음, 교통하중 지지력 확보", keywords: ["투수성", "강도", "트래피커빌리티", "압축성", "지지력"], exp: "요구조건: 낮은 투수성, 높은 강도/지지력, 시공성 등" }
    ];

    let targetQty = 20;
    let quizSet = [];
    let currentIdx = 0;
    let userAnswers = [];
    let timerInterval;
    let startTime;
    let totalSeconds = 0;
    let isConfirmed = false;
    
    let currentSingleAns = null;
    let currentMultiAns = [];
    let currentSubjAns = "";

    function adjustQty(amount) {
      targetQty = Math.max(10, Math.min(110, targetQty + amount));
      document.getElementById('qty-disp').innerText = targetQty + '문제';
    }

    // 중복 제거(비복원 무작위 추출) 로직
    function startStudy() {
      quizSet = [];
      let availableQuestions = [...mockData];

      for (let i = 0; i < targetQty; i++) {
        if (availableQuestions.length === 0) {
          availableQuestions = [...mockData]; 
        }
        const randomIndex = Math.floor(Math.random() * availableQuestions.length);
        const selectedQuestion = availableQuestions.splice(randomIndex, 1)[0];
        quizSet.push({ ...selectedQuestion, qIndex: i + 1 });
      }

      currentIdx = 0;
      userAnswers = [];
      totalSeconds = 0;
      
      document.getElementById('screen-main').classList.remove('active');
      document.getElementById('screen-study').classList.add('active');
      
      startTimer();
      renderQuiz();
    }

    function startTimer() {
      clearInterval(timerInterval);
      startTime = Date.now();
      timerInterval = setInterval(() => {
        totalSeconds = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const s = String(totalSeconds % 60).padStart(2, '0');
        document.getElementById('timer-text').innerText = `${m}:${s}`;
      }, 1000);
    }

    function renderQuiz() {
      isConfirmed = false;
      currentSingleAns = null;
      currentMultiAns = [];
      currentSubjAns = "";
      
      const q = quizSet[currentIdx];
      document.getElementById('progress-text').innerText = `${currentIdx + 1} / ${quizSet.length}`;
      document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / quizSet.length) * 100}%`;

      const nextBtn = document.getElementById('btn-submit');
      nextBtn.classList.remove('ready');
      nextBtn.innerText = "제출";
      nextBtn.disabled = true;

      let html = `<div class="question-wrapper"><div class="question-num">${q.qIndex}.</div><div class="question-text">${q.q}</div>`;
      
      if (q.type === 'single') {
        html += `<div class="question-guide">1개의 정답을 고르세요.</div></div><div class="options-list">`;
        q.options.forEach((opt, idx) => {
          html += `<div class="option" onclick="toggleSingle(${idx})" id="opt-${idx}"><div class="option-num">${idx + 1}</div><div>${opt}</div></div>`;
        });
        html += `</div>`;
      } else if (q.type === 'subjective') {
        html += `<div class="question-guide">정답을 직접 타이핑하여 입력하세요. (핵심 키워드 포함 시 정답 인정)</div></div>
                 <div class="subjective-box">
                   <textarea id="subj-input" class="subjective-input" placeholder="여기에 정답을 작성하세요..." oninput="inputSubjective()"></textarea>
                   <button class="btn-idk" onclick="handleIdk()">모름 (정답 바로보기)</button>
                   <div id="subj-result" class="subjective-result-text"></div>
                 </div>`;
      }

      html += `<div class="explanation-box" id="exp-box">
                 <div class="exp-title">해설</div>
                 <div class="exp-real-answer" id="exp-real-answer" style="display:none; margin-bottom:8px;"></div>
                 <div class="exp-text">${q.exp}</div>
               </div>`;

      document.getElementById('quiz-content').innerHTML = html;
    }

    function toggleSingle(idx) {
      if (isConfirmed) return;
      currentSingleAns = idx;
      document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
      document.getElementById(`opt-${idx}`).classList.add('selected');
      enableSubmit();
    }

    function inputSubjective() {
      if (isConfirmed) return;
      const val = document.getElementById('subj-input').value.trim();
      currentSubjAns = val;
      if (val.length > 0) enableSubmit();
      else disableSubmit();
    }

    function handleIdk() {
      if (isConfirmed) return;
      document.getElementById('subj-input').value = "모름";
      currentSubjAns = "모름";
      handleNext(); 
    }

    function enableSubmit() {
      const btn = document.getElementById('btn-submit');
      btn.classList.add('ready');
      btn.disabled = false;
    }

    function disableSubmit() {
      const btn = document.getElementById('btn-submit');
      btn.classList.remove('ready');
      btn.disabled = true;
    }

    function handleNext() {
      const q = quizSet[currentIdx];
      const nextBtn = document.getElementById('btn-submit');

      if (!isConfirmed) {
        isConfirmed = true;
        let isCorrect = false;

        if (q.type === 'single') {
          isCorrect = (currentSingleAns === q.answer);
          document.querySelectorAll('.option').forEach((el, idx) => {
            el.classList.remove('selected');
            if (idx === q.answer) el.classList.add('correct');
            else if (idx === currentSingleAns) el.classList.add('incorrect');
          });
        } 
        else if (q.type === 'subjective') {
          document.getElementById('subj-input').readOnly = true;
          
          if (currentSubjAns === "모름") {
            isCorrect = false;
          } else {
            // 여러 키워드 중 하나 이상 맞추면 정답 처리 (학습 편의를 위해 넓게 인정)
            const matchCount = q.keywords.filter(k => currentSubjAns.includes(k)).length;
            isCorrect = matchCount > 0; 
          }

          const resText = document.getElementById('subj-result');
          resText.innerText = isCorrect ? "정답입니다!" : "오답입니다.";
          resText.className = `subjective-result-text ${isCorrect ? 'correct' : 'incorrect'}`;
          
          const realAnsBox = document.getElementById('exp-real-answer');
          realAnsBox.style.display = 'block';
          realAnsBox.innerText = `[모범 답안] ${q.answerText}`;
        }

        userAnswers.push({
          qIndex: q.qIndex,
          type: q.type,
          question: q.q,
          options: q.options || null,
          userPick: q.type === 'single' ? currentSingleAns : currentSubjAns,
          correctAnswer: q.type === 'subjective' ? q.answerText : q.answer,
          isCorrect: isCorrect,
          exp: q.exp
        });

        document.getElementById('exp-box').style.display = 'block';
        nextBtn.innerText = (currentIdx === quizSet.length - 1) ? "결과 보기" : "다음 문제로";
        enableSubmit(); 

      } else {
        if (currentIdx < quizSet.length - 1) {
          currentIdx++;
          renderQuiz();
        } else {
          showResult();
        }
      }
    }

    function showResult() {
      clearInterval(timerInterval);
      document.getElementById('screen-study').classList.remove('active');
      document.getElementById('screen-result').classList.add('active');

      const correctCount = userAnswers.filter(a => a.isCorrect).length;
      document.getElementById('res-total').innerText = quizSet.length + '문제';
      document.getElementById('res-correct').innerText = correctCount + '문제';
      
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      document.getElementById('res-time').innerText = `${m}분 ${s}초`;

      let html = '';
      userAnswers.forEach((ans) => {
        html += `<div class="review-card ${ans.isCorrect ? 'correct' : 'incorrect'}">
                   <span class="badge ${ans.isCorrect ? 'correct' : 'incorrect'}">${ans.isCorrect ? '✓' : '✕'}</span>
                   <div class="review-q-text" style="margin-left: 36px;">${ans.qIndex}. ${ans.question}</div>
                   <div style="margin-left: 36px; display: flex; flex-direction: column; gap: 8px;">`;

        if (ans.type === 'single') {
          ans.options.forEach((opt, idx) => {
            let style = 'padding: 8px; border-radius: 6px; border: 1px solid #e0e0e0; font-size: 13px;';
            const isAnsCorrect = (idx === ans.correctAnswer);
            const isUserPicked = (idx === ans.userPick);
            
            if (isAnsCorrect) style += ' background: var(--success-bg); border-color: var(--success); font-weight: bold;';
            else if (isUserPicked && !isAnsCorrect) style += ' background: var(--danger-bg); border-color: var(--danger); text-decoration: line-through;';
            
            html += `<div style="${style}">${idx + 1}. ${opt}</div>`;
          });
        } else if (ans.type === 'subjective') {
          html += `<div style="padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size:13px;">
                     <div style="color: #666; margin-bottom: 6px;">나의 답안: <span style="${ans.isCorrect ? 'color:var(--success);' : 'color:var(--danger);'}">${ans.userPick}</span></div>
                     <div style="color: var(--primary); font-weight: bold;">모범 답안: ${ans.correctAnswer}</div>
                   </div>`;
        }

        html += `  </div>
                   <div class="review-exp" style="margin-left:36px;"><strong>해설:</strong> ${ans.exp}</div>
                 </div>`;
      });
      document.getElementById('review-list').innerHTML = html;
    }

    function goToMain() {
      clearInterval(timerInterval);
      document.getElementById('screen-study').classList.remove('active');
      document.getElementById('screen-result').classList.remove('active');
      document.getElementById('screen-main').classList.add('active');
    }
  </script>
</body>
</html>
